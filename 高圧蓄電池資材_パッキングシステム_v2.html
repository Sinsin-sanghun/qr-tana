<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高圧蓄電池資材 パッキングシステム / 패킹 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0f2a43;--blue:#1c5d8c;--teal:#1f8a8a;--ice:#eaf2f8;--green:#2f7d5b;--red:#b4452f;--amber:#c9821a;--purple:#5a4b9c;
--ink:#1d2733;--mut:#5b6b7a;--line:#d7e2ec;--bg:#eef3f8;--card:#fff;--head:#143b5e;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Helvetica Neue','Hiragino Sans','Noto Sans KR','Noto Sans JP',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(15,42,67,.18)}
.topbar h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap}
.topbar .sub{font-size:11px;color:#cfe0ee;margin-left:-6px}
.spacer{flex:1}
.btn{border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--navy);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.btn.gh{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.add{background:var(--amber);color:#fff}.btn.dl{background:var(--green);color:#fff}.btn.sm{padding:6px 9px;font-size:11.5px}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;padding:7px 11px;font-weight:700;cursor:pointer;font-size:12px}
.lang button.on{background:#fff;color:var(--navy)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:9px 16px 0;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:35}
.tab{border:1px solid var(--line);border-bottom:0;background:#f1f6fb;color:var(--mut);padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
.tab.on{background:var(--head);color:#fff;border-color:var(--head)}
.tab .cnt{opacity:.7;font-weight:600;margin-left:5px;font-size:11px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--ink);max-width:230px}
.toolbar input.search{min-width:190px}
.stat{font-size:12px;color:var(--mut)}.stat b{color:var(--navy)}
.panel{margin:12px 18px 0;background:#fbf7ee;border:1px solid #ecdcc1;border-radius:10px;overflow:hidden}
.panel summary{cursor:pointer;padding:10px 16px;font-weight:800;color:#8a5a16;list-style:none}
.panel summary::-webkit-details-marker{display:none}
.panel .pbody{padding:4px 16px 14px;display:flex;gap:26px;flex-wrap:wrap}
.panel h4{margin:8px 0 6px;font-size:12.5px;color:var(--navy)}
.panel ul{margin:0;padding-left:16px}.panel li{font-size:12.5px;margin:3px 0;color:var(--ink)}
.legend-chip{display:inline-block;min-width:20px;text-align:center;background:#e7f1ee;color:var(--teal);border:1px solid #bfe0d6;border-radius:5px;font-weight:800;margin-right:6px;padding:0 4px}
.panel .usage{flex-basis:100%;color:var(--mut);font-size:12px;border-bottom:1px dashed #ecdcc1;padding-bottom:9px;margin-bottom:2px}
.wrap{padding:13px 16px 14px;flex:1;min-height:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:0 1px 3px rgba(15,42,67,.06);flex:1;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%}
thead th{position:sticky;top:0;background:var(--head);color:#fff;font-weight:700;font-size:11px;padding:9px 7px;text-align:left;white-space:nowrap;border-right:1px dotted rgba(255,255,255,.4);border-bottom:1px solid #7f96ab;z-index:5}
thead th:last-child{border-right:0}
thead th:hover{background:#1b4d77}
tbody td{padding:5px 7px;border-bottom:1px dotted #9fafbe;border-right:1px dotted #9fafbe;vertical-align:top}
tbody td:first-child{border-left:1px dotted #9fafbe}
tbody tr:nth-child(even){background:#fafcfe}
tbody tr.pk1>td{background:#d4e9da}
tbody tr.pk2>td{background:#f6d9d9}
tbody tr.pk3>td{background:#d6e4f5}
tbody tr.pk4>td{background:#f8e6c6}
tbody tr.pk5>td{background:#e1d6ef}
tbody tr.pk0>td{background:#dee4ea}
tbody tr.pk1:hover>td{background:#c6e1cd}
tbody tr.pk2:hover>td{background:#f0caca}
tbody tr.pk3:hover>td{background:#c7d9ee}
tbody tr.pk4:hover>td{background:#f3dab2}
tbody tr.pk5:hover>td{background:#d4c6e7}
tbody tr.pk0:hover>td{background:#d0d8e0}
tbody tr:hover{background:#eef7fd}
td .cell{min-height:18px;outline:none;border-radius:4px;padding:3px 5px;font-size:12px;line-height:1.5;white-space:pre-wrap}
td .cell:focus{background:#fff;box-shadow:0 0 0 2px var(--blue) inset}
td.idx{color:var(--mut);font-weight:700;text-align:center;background:#f4f8fb;width:30px}
.colw-pkg{min-width:140px}.colw-item{min-width:230px}.colw-model{min-width:200px}.colw-size{min-width:150px}.colw-memo{min-width:190px}
.no,.qty{width:54px;text-align:center}.unit,.arr,.status{width:64px}.shelf{width:62px;text-align:center;font-weight:700;color:var(--navy)}
.badge .cell{text-align:center;font-weight:800}
.b-o{color:var(--green)}.b-x{color:var(--red)}.b-d{color:var(--amber)}.b-s{color:var(--blue)}.b-n{color:var(--mut)}.b-c{color:var(--teal)}.b-qb{color:var(--blue)}
.selcell{min-height:18px;cursor:pointer;text-align:center;font-weight:800;border-radius:4px;padding:3px 5px;font-size:13px;line-height:1.5;user-select:none}
.selcell:hover{background:#eef4fb;box-shadow:0 0 0 1px #cdd9e4 inset}
.selcell.empty{color:#b6c2cd;font-weight:700}
.selmenu{position:fixed;z-index:80;background:#fff;border:1px solid #cdd9e4;border-radius:10px;box-shadow:0 10px 28px rgba(15,42,67,.22);padding:6px;display:none;min-width:152px}
.selmenu.on{display:block}
.selopt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer}
.selopt:hover{background:#eef4fb}
.selsym{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:6px;font-weight:800;font-size:14px;background:#f1f6fb;flex:none}
.sellab{font-size:12.5px;color:var(--ink)}
.photo{width:68px}.ph{width:60px;height:46px;border:1px dashed #b9c9d8;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9fb1c2;font-size:10px;background:#f7fafc;overflow:hidden;text-align:center}
.phcell{display:flex;align-items:center;padding:3px}
.phprev{position:relative;width:52px;height:40px;border-radius:7px;overflow:hidden;cursor:pointer;background:#eef2f6;box-shadow:0 1px 3px rgba(15,42,67,.22);transition:transform .12s,box-shadow .12s}
.phprev:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,42,67,.3)}
.phprev img{width:100%;height:100%;object-fit:cover;display:block}
.phcount{position:absolute;right:2px;bottom:2px;background:rgba(17,28,40,.8);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;line-height:1.4}
.phadd2{width:52px;height:40px;border-radius:7px;border:1.5px dashed #c2cedb;display:flex;align-items:center;justify-content:center;color:#9fb1c2;cursor:pointer;font-size:19px;font-weight:700;background:#f9fbfd}
.phadd2:hover{border-color:var(--blue);color:var(--blue);background:#eef4fb}
.phmgr{position:fixed;inset:0;background:rgba(8,18,28,.55);display:none;align-items:center;justify-content:center;z-index:72;padding:24px}
.phmgr.on{display:flex}
.phmgr-box{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.42);overflow:hidden}
.phmgr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy)}
.phmgr-x{cursor:pointer;font-size:24px;color:var(--mut);line-height:1}
.phmgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:18px;overflow:auto}
.mgrt{position:relative;border-radius:10px;overflow:hidden;background:#eef2f6;aspect-ratio:4/3;border:1px solid var(--line)}
.mgrt img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.mgrx{position:absolute;top:6px;right:6px;border:0;background:rgba(180,69,47,.94);color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mgrx:hover{background:#9e3a26}
.mgrempty{grid-column:1/-1;text-align:center;color:var(--mut);padding:34px}
.phmgr-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.empty{flex-direction:column;cursor:default;border-style:dashed}
.ph.has{border-style:solid;border-color:#9fc0d8}
.phname{font-size:8px;line-height:1.15;color:#8194a3;word-break:break-all;padding:2px;text-align:center;cursor:pointer}
.ph{position:relative}
.phedit{position:absolute;top:1px;right:1px;border:0;background:rgba(15,42,67,.8);color:#fff;border-radius:5px;width:18px;height:18px;font-size:11px;line-height:1;padding:0;cursor:pointer;display:none}
.ph.has:hover .phedit{display:block}
.acts{width:42px;text-align:center}
.del{border:0;background:#fbe7e2;color:var(--red);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px;font-weight:800}
.metacap{padding:10px 14px;background:#f1f6fb;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;font-size:12px;color:var(--navy);display:flex;gap:18px;flex-wrap:wrap}
.metacap b{color:var(--blue)}
.foot{display:flex;gap:20px;flex-wrap:wrap;padding:13px 20px;color:var(--mut);font-size:12px}.foot b{color:var(--navy)}
.hint{padding:8px 18px 0;color:var(--mut);font-size:11.5px}
.lb{position:fixed;inset:0;background:rgba(8,18,28,.82);display:none;align-items:center;justify-content:center;z-index:120;padding:30px}
.lb.on{display:flex}.lb img{max-width:90%;max-height:86%;border-radius:10px}.lb .x{position:absolute;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bakbadge{font-size:11px;font-weight:800;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.35);color:#fff}
.bakbadge.ok{background:rgba(47,125,91,.30)}
.bakbadge.warn{background:rgba(201,130,26,.38)}
.bakbadge.bad{background:rgba(180,69,47,.50)}
.remindbar{background:#fdecea;color:#9c2a16;border-bottom:1px solid #f3c6bd;padding:9px 18px;font-weight:700;font-size:12.5px;cursor:pointer;text-align:center}
.remindbar:hover{background:#fbded9}
@media print{.topbar,.tabs,.toolbar,.acts,.del,.hint,.remindbar{display:none}.tablecard{max-height:none}}
</style>

</div>

function load(){
  try{
    if(window.__EMBEDDED_BACKUP__){
      const emb=window.__EMBEDDED_BACKUP__;
      const done=localStorage.getItem("himgr_embed_imported");
      const cur=localStorage.getItem(LS);
      const msg=(localStorage.getItem(LSL)||"ja")==="ko"
        ?"이 파일에 내장된 데이터로 복원할까요?\n(현재 브라우저에 저장된 데이터를 덮어씁니다)"
        :"このファイルに埋め込まれたデータで復元しますか？\n（このブラウザに保存済みのデータを上書きします）";
      if(emb._stamp&&done!==emb._stamp&&(!cur||confirm(msg))){
        const photos=emb._photos;
        const o=JSON.parse(JSON.stringify(emb));delete o._photos;delete o._stamp;
        localStorage.setItem(LS,JSON.stringify(o));
        localStorage.setItem("himgr_embed_imported",emb._stamp);
        if(photos&&Object.keys(photos).length){
          setTimeout(()=>{Promise.all(Object.keys(photos).map(k=>{const v=photos[k];const arr=Array.isArray(v)?v:[v];return idbSet(k,arr.map(dataURLtoBlob));}))
            .then(()=>hydratePhotos()).catch(err=>console.error("photo import:",err));},0);
        }
        return o;
      }
    }
  }catch(e){}
  try{const s=localStorage.getItem(LS);if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(CORE));}

function t(){return I18N[lang];}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function val(id){const e=document.getElementById(id);return e?e.value:"";}

function setLang(l){lang=l;localStorage.setItem(LSL,l);document.documentElement.lang=l;

function renderTabs(){const x=t();const el=document.getElementById("tabs");
  el.style.display=db.sites.length?"":"none";
  let h=`<div class="tab ${active===0?'on':''}" onclick="go(0)">${x.master}<span class="cnt">${db.master.rows.length}</span></div>`;

function buildFilters(){const x=t();

      else{inner=`<div class="cell" contenteditable="true" data-i="${oi}" data-k="${c}" oninput="onEditM(this)">${esc(r[c])}</div>`;

function pickImg(scope,i){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const near=usageBytes()/1048576>=3.5;
      shrink(rd.result,near?640:900,near?.65:.8,d=>{db.master.rows[i].img=d;if(near)toast(t().quotaNear);save();render();});};rd.readAsDataURL(f);};inp.click();}
function shrink(u,max,q,cb){const im=new Image();im.onload=()=>{let w=im.width,h=im.height;
  if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);cb(cv.toDataURL("image/jpeg",q));};im.src=u;}
function openImg(scope,i){document.getElementById("lbImg").src=db.master.rows[i].img;document.getElementById("lb").classList.add("on");}
/* ===== 사진: 클릭 업로드→IndexedDB 자동저장 + 로컬 photos 폴더 병행 (고화질) ===== */
const PH_EXTS=["jpg","jpeg","png","JPG","JPEG","PNG"];
function photoKey(r){const m=String(r.pkg||"").match(/[①②③④⑤⑥⑦⑧⑨]/);
  const map={"①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9"};
  const p=m?map[m[0]]:"x";const no=String(r.no||"").replace(/[^0-9A-Za-z]/g,"")||"x";return p+"-"+no;}
/* IndexedDB (사진 전용·고화질 원본 저장) */
let _idb=null;
function idb(){return _idb?Promise.resolve(_idb):new Promise((res,rej)=>{const rq=indexedDB.open("himgr_photos",1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore("ph");rq.onsuccess=()=>{_idb=rq.result;res(_idb);};rq.onerror=()=>rej(rq.error);});}
function idbGet(k){return idb().then(d=>new Promise((res,rej)=>{const r=d.transaction("ph","readonly").objectStore("ph").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function idbSet(k,b){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction("ph","readwrite");t.objectStore("ph").put(b,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbDel(k){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction("ph","readwrite");t.objectStore("ph").delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbKeys(){return idb().then(d=>new Promise((res,rej)=>{const r=d.transaction("ph","readonly").objectStore("ph").getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
/* 셀 렌더 + 비동기 로드 */
function photoBox(key){return `<div class="phcell" data-key="${esc(key)}"></div>`;}
function hydratePhotos(){document.querySelectorAll('.phcell[data-key]').forEach(loadCell);}
function phGet(key){return idbGet(key).then(v=>!v?[]:(Array.isArray(v)?v:[v]));}
function phAdd(key,blob){return phGet(key).then(a=>{a.push(blob);return idbSet(key,a);});}
function phDelete(key,idx){return phGet(key).then(a=>{a.splice(idx,1);return a.length?idbSet(key,a):idbDel(key);});}
function loadCell(el){const key=el.dataset.key;
  phGet(key).then(arr=>{
    if(arr.length){renderCellThumb(el,key,URL.createObjectURL(arr[0]),arr.length);}
    else{probeFolder(el,key,0);}
  }).catch(()=>probeFolder(el,key,0));}
function probeFolder(el,key,i){if(i>=PH_EXTS.length){renderCellEmpty(el,key);return;}
  const url="photos/"+key+"."+PH_EXTS[i],im=new Image();
  im.onload=()=>renderCellThumb(el,key,url,1);
  im.onerror=()=>probeFolder(el,key,i+1);im.src=url;}
function renderCellThumb(el,key,src,count){el.innerHTML="";el.onclick=()=>openMgr(key);el.title=t().photoOpen;
  const d=document.createElement("div");d.className="phprev";
  const img=document.createElement("img");img.src=src;d.appendChild(img);
  if(count>1){const b=document.createElement("span");b.className="phcount";b.textContent="+"+(count-1);d.appendChild(b);}
  el.appendChild(d);}
function renderCellEmpty(el,key){el.innerHTML="";el.onclick=()=>openMgr(key);el.title=t().photoAdd;
  const a=document.createElement("div");a.className="phadd2";a.textContent="＋";el.appendChild(a);}
function refreshKey(key){const el=document.querySelector('.phcell[data-key="'+key+'"]');if(el)loadCell(el);
  if(mgrKey===key&&document.getElementById("phMgr").classList.contains("on"))renderMgr();}
function uploadPhoto(key){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.multiple=true;
  inp.onchange=e=>{const fs=[...e.target.files];if(!fs.length)return;
    let p=Promise.resolve();fs.forEach(f=>{p=p.then(()=>phAdd(key,f));});
    p.then(()=>{toast(t().photoSaved);refreshKey(key);bumpDirty();})
    .catch(err=>toast("⚠ "+(err.message||err)));};inp.click();}
/* ===== 사진 관리 팝업 ===== */
let mgrKey=null;
function openMgr(key){mgrKey=key;document.getElementById("phMgrTitle").textContent=t().photoMgr+"  ["+key+"]";
  document.getElementById("phMgrAddLbl").textContent=t().photoAdd;
  const ph=document.getElementById("phMgrPasteHint");if(ph)ph.textContent="📋 "+(t().photoPaste||"");
  document.getElementById("phMgr").classList.add("on");renderMgr();}
function closeMgr(){document.getElementById("phMgr").classList.remove("on");mgrKey=null;}
function renderMgr(){const key=mgrKey,grid=document.getElementById("phMgrGrid");if(!key){grid.innerHTML="";return;}
  phGet(key).then(arr=>{
    if(!arr.length){probeMgrFolder(key,grid,0);return;}
    grid.innerHTML=arr.map((b,i)=>{const u=URL.createObjectURL(b);
      return `<div class="mgrt"><img src="${u}" onclick="enlarge('${u}')"><button class="mgrx" onclick="delInMgr(${i})" title="${esc(t().photoDel)}">×</button></div>`;}).join("");});}
function probeMgrFolder(key,grid,i){if(i>=PH_EXTS.length){grid.innerHTML=`<div class="mgrempty">${esc(t().photoNone)}</div>`;return;}
  const url="photos/"+key+"."+PH_EXTS[i],im=new Image();
  im.onload=()=>{grid.innerHTML=`<div class="mgrt"><img src="${url}" onclick="enlarge('${url}')"></div>`;};
  im.onerror=()=>probeMgrFolder(key,grid,i+1);im.src=url;}
function delInMgr(i){if(!mgrKey)return;if(!confirm(t().photoDel))return;phDelete(mgrKey,i).then(()=>{refreshKey(mgrKey);bumpDirty();});}
function addInMgr(){if(mgrKey)uploadPhoto(mgrKey);}
/* Ctrl+V: 사진 관리 팝업이 열려 있으면 클립보드 이미지/이미지파일을 바로 등록 */
document.addEventListener("paste",function(e){
  const key=mgrKey;
  if(!key||!document.getElementById("phMgr").classList.contains("on"))return;
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  const fs=[];
  for(let i=0;i<items.length;i++){const it=items[i];
    if(it.kind==="file"&&it.type.indexOf("image/")===0){const f=it.getAsFile();if(f)fs.push(f);}}
  if(!fs.length)return;
  e.preventDefault();
  let p=Promise.resolve();fs.forEach(f=>{p=p.then(()=>phAdd(key,f));});
  p.then(()=>{toast(t().photoSaved);refreshKey(key);bumpDirty();})
   .catch(err=>toast("⚠ "+(err.message||err)));
});
function enlarge(src){document.getElementById("lbImg").src=src;document.getElementById("lb").classList.add("on");}
/* 백업/복원에 사진 포함 */
function blobToDataURL(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);});}
function dataURLtoBlob(d){const a=d.split(','),m=(a[0].match(/:(.*?);/)||[])[1]||'image/jpeg',bin=atob(a[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m});}
function collectPhotos(){return idbKeys().then(ks=>Promise.all(ks.map(k=>phGet(k).then(arr=>Promise.all(arr.map(blobToDataURL)).then(ds=>[k,ds]))))).then(ps=>{const o={};ps.forEach(([k,ds])=>{if(ds.length)o[k]=ds;});return o;}).catch(()=>({}));}

/* ===== 완성판 HTML 내보내기 (사진·데이터 내장 단일 파일) ===== */

}).catch(err=>toast("⚠ "+(err.message||err)));}

  const out=Object.assign({},db,{_photos:photos});
  dl(new Blob([JSON.stringify(out)],{type:"application/json"}),"資材管理_backup_"+stamp()+".json");
  localStorage.setItem(LSB,new Date().toISOString());setDirty(0);updateBakBadge();updateRemind();toast(t().bakNote);});}
/* ===== F1/F2 백업 관리 ===== */
function getDirty(){return parseInt(localStorage.getItem(LSD)||"0",10)||0;}
function setDirty(n){localStorage.setItem(LSD,String(n));}
function bumpDirty(){setDirty(getDirty()+1);updateBakBadge();updateRemind();}
function daysSinceBak(){const s=localStorage.getItem(LSB);if(!s)return null;return Math.floor((Date.now()-new Date(s).getTime())/86400000);}
function updateBakBadge(){const el=document.getElementById("bakBadge");if(!el)return;const x=t();const d=daysSinceBak();
  let cls,txt;
  if(d===null){cls="bad";txt=x.bakNever;}
  else if(d<=0){cls="ok";txt=x.bakToday;}
  else{txt=x.bakDays(d);cls=d>=7?"bad":(d>=3?"warn":"ok");}
  el.className="bakbadge "+cls;el.textContent="💾 "+txt;}
function updateRemind(){const el=document.getElementById("remindBar");if(!el)return;const x=t();
  const d=daysSinceBak(),dirty=getDirty();
  const need=(dirty>=20)||(d!==null&&d>=7)||(d===null&&dirty>=1);
  if(need){el.style.display="";el.textContent=x.remind+(dirty?` (${dirty})`:"");}else{el.style.display="none";}}
/* ===== F3 저장 용량 점검 ===== */
function usageBytes(){try{const v=localStorage.getItem(LS);return v?v.length:0;}catch(e){return 0;}}
function checkUsage(){if(usageBytes()/1048576>=4.3){toast(t().quotaNear);}}
function restoreJson(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o&&o.master&&o.sites){
    const photos=o._photos;delete o._photos;db=o;save();
    if(photos&&Object.keys(photos).length){Promise.all(Object.keys(photos).map(k=>{const v=photos[k];const arr=Array.isArray(v)?v:[v];return idbSet(k,arr.map(dataURLtoBlob));})).then(()=>{render();renderTabs();toast(t().restored);});}
    else{render();renderTabs();toast(t().restored);}
  }}catch(err){toast("⚠ "+err.message);}};rd.readAsText(f);e.target.value="";}
function dl(b,n){const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;}
function resetData(){
  if(!confirm(t().confReset))return;
  const typed=prompt(t().resetType);
  if(typed===null)return;
  if(typed.trim()!==t().reset){toast(t().resetAbort);return;}
  collectPhotos().then(photos=>{
    const out=Object.assign({},db,{_photos:photos});
    dl(new Blob([JSON.stringify(out)],{type:"application/json"}),"資材管理_初期化前backup_"+stamp()+".json");
    toast(t().resetBak);
    db=JSON.parse(JSON.stringify(CORE));sortState={key:null,dir:1};save();render();renderTabs();
  }).catch(err=>toast("⚠ "+(err.message||err)));
}

let toastT;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2200);}
let savedT;function flashSaved(){const e=document.getElementById("footSaved");e.innerHTML="● "+t().saved;e.style.color="var(--green)";clearTimeout(savedT);savedT=setTimeout(()=>e.style.color="var(--mut)",1200);}

/* ===== F4 자가 점검: 데이터 손상/잘림 감지 ===== */
if(!CORE||!CORE.master||!Array.isArray(CORE.master.rows)||CORE.master.rows.length<1){
  alert("⚠ データが読み込めません。ファイルが破損/切り詰められた可能性があります。\n⚠ 데이터를 불러올 수 없습니다. 파일이 손상/잘렸을 수 있습니다.");}
/* ===== F1 닫기 전 백업 경고 ===== */
window.addEventListener("beforeunload",function(ev){if(getDirty()>0){ev.preventDefault();ev.returnValue="";}});
applyStatic();renderTabs();render();updateBakBadge();updateRemind();
</script>

"ja":"軽く<b>施工が容易で</b>、規定の絶縁(6.6kV)で高圧を安全に伝えます。"},"analogy":{"ko":"전기를 실어 나르는 <b>굵은 송수관</b> 같아요 — 알루미늄 심이라 다루기 가볍습니다.","ja":"電気を運ぶ<b>太い送水管</b>のようで、アルミ芯なので扱いが軽いです。"}},"4_3":{"color":"linear-gradient(135deg,#7c3aed,#a855f7)","emoji":"🌩️","svg":"arrester","jp":"避雷器","ko":"피뢰기(避雷器)","chips":{"ja":["GL-B6DG5-T","電線直付","高圧用","サージ保護"],"ko":["GL-B6DG5-T","전선 직부착","고압용","서지 보호"]},"use":{"ko":"전주나 인입부에 다는 <b>벼락 방어 부품</b>입니다. 낙뢰로 갑자기 <b>비정상적으로 높은 전압(서지)</b>이 전선에 몰려오면, 그 과전압을 <b>땅으로 흘려보내</b> PAS·QB·배터리 같은 비싼 기기를 보호합니다. 전선에 직접 부착하는 형태입니다.","ja":"電柱や引込部に取り付ける<b>落雷防御の部品</b>です。落雷で突然<b>異常に高い電圧(サージ)</b>が電線に押し寄せると、その過電圧を<b>大地へ逃がし</b>、PAS・QB・バッテリーなど高価な機器を守ります。電線に直付けするタイプです。"},"perf":{"ko":"GL-B6DG5-T 전선 직부착형 — 고압선에 바로 달려 <b>벼락이 들이치는 즉시</b> 과전압을 땅으로 빼냅니다.","ja":"GL-B6DG5-T 電線直付形 — 高圧線に直に付き<b>雷が来た瞬間</b>に過電圧を大地へ逃がします。"},"eff":{"ko":"낙뢰로 인한 <b>기기 고장·정전을 예방</b>해, 비싼 설비를 지키고 복구 비용을 줄입니다.","ja":"落雷による<b>機器故障・停電を予防</b>し、高価な設備を守り復旧費用を減らします。"},"analogy":{"ko":"건물의 <b>피뢰침</b>처럼 벼락의 에너지를 땅으로 안전하게 빼주는 부품이에요.","ja":"建物の<b>避雷針</b>のように雷のエネルギーを大地へ安全に逃がす部品です。"}},"4_4":{"color":"linear-gradient(135deg,#0f766e,#0d9488)","emoji":"🔗","svg":"lug","jp":"アルミ端末用 圧着端子(バイメタル)","ko":"알루미늄 단말용 압착단자(바이메탈)","chips":{"ja":["BML2-150D-12-BL","パンドウィット","バイメタル","電食防止"],"ko":["BML2-150D-12-BL","팬듀잇","바이메탈(이종금속)","전식 방지"]},"use":{"ko":"<b>알루미늄 고압 케이블</b>의 끝을 <b>구리 부스바(전기 연결용 구리 막대)</b>에 잇기 위해 케이블 끝에 압착해 다는 <b>금속 연결단자(러그)</b>입니다. 한쪽은 알루미늄, 다른 쪽은 구리로 된 <b>이종금속(바이메탈)</b> 단자라, 알루미늄과 구리가 직접 닿을 때 생기는 <b>전식(電食: 금속 부식)을 막아</b> 줍니다.","ja":"<b>アルミ高圧ケーブル</b>の端を<b>銅ブスバー(電気接続用の銅の棒)</b>につなぐため、ケーブル端に圧着して取り付ける<b>金属の接続端子(ラグ)</b>です。片側がアルミ、もう片側が銅の<b>異種金属(バイメタル)</b>端子で、アルミと銅が直接触れて起きる<b>電食(金属腐食)を防ぎます</b>。"},"perf":{"ko":"BML2-150D-12-BL(팬듀잇) 바이메탈 — 150sq 케이블 전용에 <b>이종금속 접합부의 부식을 막는</b> 구조입니다.","ja":"BML2-150D-12-BL(パンドウィット) バイメタル — 150sqケーブル専用で<b>異種金属接合部の腐食を防ぐ</b>構造です。"},"eff":{"ko":"접속부 부식을 막아 <b>접촉저항 상승·발열·접속불량을 예방</b>하고 오래 안정적으로 통전됩니다.","ja":"接続部の腐食を防いで<b>接触抵抗の上昇・発熱・接続不良を予防</b>し、長く安定して通電します。"},"analogy":{"ko":"성질 다른 두 금속을 잇는 <b>전용 어댑터</b> 같아요 — 직접 닿아 삭는 걸 막아줍니다.","ja":"性質の異なる二つの金属をつなぐ<b>専用アダプター</b>のようで、直に触れて傷むのを防ぎます。"}},"4_5":{"color":"linear-gradient(135deg,#1d4ed8,#3b82f6)","emoji":"🔗","svg":"lug","jp":"PAS用圧縮端子","ko":"PAS용 압축단자","chips":{"ja":["圧縮端子 100-100/150","戸上電機","PAS接続用","圧縮接続"],"ko":["압축단자 100-100/150","토가미전기","PAS 접속용","압축 접속"]},"use":{"ko":"전주 위 <b>PAS(기중 개폐기)</b>에 고압 케이블을 잇기 위해 케이블 끝에 다는 <b>금속 연결단자</b>입니다. 전용 공구로 단자를 케이블에 <b>강하게 눌러(압축) 압착</b>해 빠지지 않게 단단히 접속합니다.","ja":"電柱上の<b>PAS(気中開閉器)</b>に高圧ケーブルをつなぐため、ケーブル端に取り付ける<b>金属の接続端子</b>です。専用工具で端子をケーブルに<b>強く押し付けて(圧縮)圧着</b>し、抜けないようしっかり接続します。"},"perf":{"ko":"100-100/150(토가미전기) 압축형 — 케이블 굵기에 맞춰 <b>강하게 압착</b>해 접속이 단단하고 안정적입니다.","ja":"100-100/150(戸上電機) 圧縮形 — ケーブル径に合わせ<b>強く圧着</b>し、接続が堅固で安定します。"},"eff":{"ko":"접속이 헐거워지지 않아 <b>발열·접속불량을 막고</b> 통전이 안정됩니다.","ja":"接続が緩まず<b>発熱・接続不良を防ぎ</b>、通電が安定します。"},"analogy":{"ko":"전선 끝을 <b>꽉 눌러 물리는 집게</b> 같아요 — 한번 압착하면 빠지지 않습니다.","ja":"電線端を<b>ぎゅっと噛ませる留め具</b>のようで、一度圧着すれば抜けません。"}},"4_6":{"color":"linear-gradient(135deg,#15803d,#22c55e)","emoji":"🔌","svg":"powercable","jp":"高圧立下げ電線(PDC100sq)","ko":"고압 입하 전선(PDC 100sq)","chips":{"ja":["PDC 100sq","3線一式","立下げ用","高圧電線"],"ko":["PDC 100sq","3선 일습","입하용","고압 전선"]},"use":{"ko":"전주 <b>위쪽</b>의 고압 전선에서 전주 <b>아래쪽</b>의 PAS·인입 설비까지 전기를 <b>끌어내리는(입하시키는) 고압 전선</b>입니다. 3상 전기를 보내야 하므로 3선이 한 묶음(일습)으로 들어갑니다.","ja":"電柱の<b>上部</b>の高圧電線から電柱の<b>下部</b>のPAS・引込設備まで電気を<b>引き下ろす(立ち下げる)高圧電線</b>です。三相の電気を送るため3線が一組(一式)で入ります。"},"perf":{"ko":"PDC 100sq 3선 — 100sq 단면의 입하 전용 전선으로 <b>3상 전체를 한 세트</b>로 안정 배선합니다.","ja":"PDC 100sq 3線 — 100sq断面の立下げ専用電線で<b>三相全体を一セット</b>で安定配線します。"},"eff":{"ko":"전주 상부와 하부 기기를 <b>깔끔하게 연결</b>해 인입 배선이 정돈되고 안전합니다.","ja":"電柱上部と下部の機器を<b>きれいに接続</b>し、引込配線が整い安全です。"},"analogy":{"ko":"옥상 수도관을 <b>아래층으로 끌어내리는 내림관</b> 같아요 — 위에서 아래로 잇는 전선입니다.","ja":"屋上の水道管を<b>下階へ引き下ろす立て管</b>のようで、上から下へつなぐ電線です。"}},"4_7":{"color":"linear-gradient(135deg,#475569,#64748b)","emoji":"🧰","svg":"device","jp":"PAS附属一式(引き紐/信号CB/SOG制御箱/端末ブッシング/光引込金具)","ko":"PAS 부속 일습(조작 끈/신호 CB/SOG 제어함/단말 부싱/광 인입 금구)","chips":{"ja":["引き紐","信号CB","SOG制御箱","端末ブッシング・光引込金具"],"ko":["조작 끈","신호 CB","SOG 제어함","단말 부싱·광 인입 금구"]},"use":{"ko":"전주 위 <b>PAS(기중 개폐기)를 조작·제어·통신하는 데 필요한 부속 부품들을 한데 모은 묶음</b>입니다. 땅에서 개폐기를 여닫는 <b>조작 끈</b>, 신호용 차단기, 자동개방을 제어하는 <b>SOG 제어함</b>, 케이블 끝을 받는 단말 부싱, 광통신을 끌어들이는 인입 금구 등이 들어 있어, PAS가 제대로 동작하도록 보조합니다.","ja":"電柱上の<b>PAS(気中開閉器)を操作・制御・通信するために必要な附属部品をまとめた一式</b>です。地上から開閉器を入切する<b>操作の引き紐</b>、信号用ブレーカー、自動開放を制御する<b>SOG制御箱</b>、ケーブル端を受ける端末ブッシング、光通信を引き込む金具などが入り、PASが正しく動くよう補助します。"},"perf":{"ko":"조작 끈·신호 CB·SOG 제어함·부싱·광 인입 금구 일습 — <b>조작과 제어에 필요한 부품이 한 세트</b>로 갖춰져 누락 없이 설치됩니다.","ja":"引き紐・信号CB・SOG制御箱・ブッシング・光引込金具の一式 — <b>操作と制御に必要な部品が一セット</b>で揃い、漏れなく設置できます。"},"eff":{"ko":"부속이 모두 갖춰져 PAS를 <b>안전하게 조작·자동제어·원격감시</b>할 수 있습니다.","ja":"附属が全て揃い、PASを<b>安全に操作・自動制御・遠隔監視</b>できます。"},"analogy":{"ko":"가전제품에 딸려 오는 <b>리모컨·전용 부속 세트</b> 같아요 — 본체를 제대로 쓰게 해줍니다.","ja":"家電に付属する<b>リモコン・専用パーツ一式</b>のようで、本体をきちんと使えるようにします。"}},"4_8":{"color":"linear-gradient(135deg,#0369a1,#0ea5e9)","emoji":"🛡️","svg":"term","jp":"アルミ用端子 屋外(高圧端末材)","ko":"알루미늄용 단자 옥외(고압 종단재)","chips":{"ja":["6.6kV AL-CVT150sq用","屋外用","西日本電線","高圧端末処理"],"ko":["6.6kV AL-CVT150sq용","옥외용","니시니혼전선","고압 종단 처리"]},"use":{"ko":"옥외에서 <b>알루미늄 고압 케이블(6.6kV)의 잘린 끝</b>을 마감 처리하는 <b>종단재(端末材)</b> 세트입니다. 케이블을 자르면 절연층 속 충전부가 드러나는데, 이 자재로 그 끝을 <b>절연하고 빗물이 스미지 않게 방수 처리</b>해 옥외 인입부에서 안전하게 마무리합니다.","ja":"屋外で<b>アルミ高圧ケーブル(6.6kV)の切断端</b>を仕上げる<b>端末材</b>セットです。ケーブルを切ると絶縁層内の充電部が露出しますが、この材料でその端を<b>絶縁し雨水が浸みないよう防水処理</b>し、屋外引込部で安全に仕上げます。"},"perf":{"ko":"6.6kV AL-CVT150sq 전용 옥외용(니시니혼전선) — 해당 케이블에 딱 맞고 <b>옥외 환경(비·햇빛)을 견디는</b> 종단 처리입니다.","ja":"6.6kV AL-CVT150sq専用の屋外用(西日本電線) — 当該ケーブルに適合し<b>屋外環境(雨・日射)に耐える</b>端末処理です。"},"eff":{"ko":"케이블 끝을 절연·방수해 <b>누전·절연파괴·침수를 막아</b> 옥외에서도 오래 안전합니다.","ja":"ケーブル端を絶縁・防水し<b>漏電・絶縁破壊・浸水を防ぎ</b>、屋外でも長く安全です。"},"analogy":{"ko":"잘린 전선 끝을 <b>방수 마개로 야무지게 봉하는</b> 것과 같아요 — 비도 막고 감전도 막습니다.","ja":"切れた電線端を<b>防水キャップでしっかり封じる</b>のと同じで、雨も感電も防ぎます。"}},"2_1":{"color":"linear-gradient(135deg,#0f766e,#0d9488)","emoji":"📟","svg":"device","jp":"エネセーバ(電力監視)","ko":"에너세이버(전력 감시장치)","chips":{"ja":["電力監視","逆潮流","計測"],"ko":["전력 감시","역송 감시","계측"]},"use":{"ko":"<b>전기를 받아 변환·분배하는 금속 캐비닛</b>(QB=큐비클) 안에 붙는 <b>전력 감시장치</b>로, 발전소가 얼마나 쓰고 또 남는 전기를 계통으로 되돌리는지(역송)를 늘 지켜보는 <b>계측 장치</b>입니다.","ja":"<b>電気を受けて変換・分配する金属キャビネット</b>(QB=キュービクル)の中に付く<b>電力監視装置</b>で、発電所がどれだけ使い、余った電気を系統へ戻すか(逆潮流)を常に見張る<b>計測装置</b>です。"},"perf":{"ko":"TES-GA-AAN 사양으로, 사용 전력과 역송 전력을 함께 측정해 한눈에 보여주는 점이 편합니다.","ja":"TES-GA-AAN仕様で、使用電力と逆潮流をまとめて測り一目で確認できる点が便利です。"},"eff":{"ko":"전기 흐름을 실시간으로 알 수 있어, 이상 사용이나 과도한 역송을 빨리 알아채 안전·효율 관리에 도움이 됩니다.","ja":"電気の流れをリアルタイムで把握でき、異常な使用や過剰な逆潮流を早く察知して安全・効率管理に役立ちます。"},"analogy":{"ko":"집의 <b>전기 계량기</b>가 들어오고 나가는 전기를 동시에 세어주는 것과 같습니다.","ja":"家の<b>電気メーター</b>が入る電気と出る電気を同時に数えてくれるようなものです。"}},"2_2":{"color":"linear-gradient(135deg,#475569,#64748b)","emoji":"🔩","svg":"lug","jp":"QB側 325sq用端子(1穴)","ko":"QB측 325sq용 단자(구멍 1개)","chips":{"ja":["圧着端子","325sq","1穴"],"ko":["압착단자","325sq","1구멍"]},"use":{"ko":"<b>QB(큐비클: 전기를 받아 분배하는 캐비닛)</b> 안에서 굵은 <b>325sq 케이블</b>의 끝에 끼워 <b>단자대(부스바: 전기를 모아 잇는 금속 막대)</b>에 볼트로 연결하는 <b>압착단자</b>이며, 볼트 구멍이 1개인 형식입니다.","ja":"<b>QB(キュービクル:電気を受けて分配するキャビネット)</b>の中で太い<b>325sqケーブル</b>の先に取り付け、<b>端子台(ブスバー:電気を集めてつなぐ金属棒)</b>へボルトで接続する<b>圧着端子</b>で、ボルト穴が1つのタイプです。"},"perf":{"ko":"LCAN600-12-6/판두이트 제품으로, 굵은 케이블을 꽉 압착해 헐거움 없이 단단히 잇도록 만들어졌습니다.","ja":"LCAN600-12-6/パンドウィット製で、太いケーブルをしっかり圧着し緩みなく確実に接続できるよう作られています。"},"eff":{"ko":"접촉이 단단하면 발열·불꽃이 줄어 전기 사고를 막고 통전이 안정됩니다.","ja":"接触がしっかりすると発熱・火花が減り、電気事故を防ぎ通電が安定します。"},"analogy":{"ko":"굵은 호스 끝에 끼워 <b>꽉 조이는 금속 물부리</b> 같아서 새거나 빠지지 않게 해 줍니다.","ja":"太いホースの先に付ける<b>しっかり締まる金属の口金</b>のようで、漏れや抜けを防ぎます。"}},"2_3":{"color":"linear-gradient(135deg,#1d4ed8,#3b82f6)","emoji":"🔌","svg":"cutout","jp":"カットアウト本体(PCS)","ko":"컷아웃 본체(PCS용)","chips":{"ja":["開閉器","ヒューズ保護","PCS"],"ko":["개폐기","퓨즈 보호","PCS"]},"use":{"ko":"<b>QB(전기를 받아 분배하는 캐비닛)</b> 안의 회로를 손으로 열고 닫거나, 안에 든 퓨즈로 보호하는 <b>개폐기(컷아웃: 회로를 끊었다 이었다 하는 스위치 부품)</b>로, PCS(전력변환장치) 회로에 쓰입니다.","ja":"<b>QB(電気を受けて分配するキャビネット)</b>内の回路を手で開閉したり、中のヒューズで保護する<b>開閉器(カットアウト:回路を切ったりつないだりするスイッチ部品)</b>で、PCS(電力変換装置)回路に使います。"},"perf":{"ko":"FC-30C 형식으로, 퓨즈를 끼 。"},"analogy":{"ko":"전주와 받침 블록을 한데 묶는 '굵은 U자 허리띠' 같은 밴드입니다.","ja":"柱と支えブロックを束ねる「太いU字ベルト」のようなバンドです。"}},"3_9":{"color":"linear-gradient(135deg,#15803d,#22c55e)","emoji":"📍","svg":"stake","jp":"埋設表示杭(EA杭)","ko":"매설 표시 말뚝(EA杭)","chips":{"ja":["石井マーク SP142B","接地系表示","目印"],"ko":["이시이마크 SP142B","접지계 표시","표식"]},"use":{"ko":"땅에 박아 두는 작은 <b>표시 말뚝(머리에 글자가 새겨진 말뚝)</b>입니다. 부지 땅속에 묻힌 선·설비의 위치를 알려, 나중에 함부로 파다 손상되지 않게 합니다. EA는 <b>접지 계열</b>을 가리키는 표시입니다.","ja":"地面に打ち込む小さな<b>表示杭(頭に文字が刻まれた杭)</b>です。敷地の地中に埋まる線・設備の位置を知らせ、後で誤って掘って傷つけないようにします。EAは<b>接地系統</b>を示す表示です。"},"perf":{"ko":"이시이마크 SP142B 규격 말뚝이라 표기가 표준화되어, 누가 봐도 무엇이 묻혔는지 알아보기 쉽습니다.","ja":"石井マーク SP142B 規格の杭で表記が標準化され、誰が見ても何が埋まっているか判別しやすいです。"},"eff":{"ko":"굴착·점검 때 묻힌 접지선 위치를 바로 알아 사고를 막습니다.","ja":"掘削・点検時に埋設接地線の位置がすぐ分かり、事故を防げます。"},"analogy":{"ko":"땅속 보물 위치를 알려 주는 '여기 묻혔음' 표지판 같은 말뚝입니다.","ja":"地中の位置を知らせる「ここに埋設」の標識のような杭です。"}},"3_10":{"color":"linear-gradient(135deg,#b45309,#d97706)","emoji":"🪛","svg":"bracket","jp":"WHM盤 取付金具","ko":"전력량계함 부착 금구(WHM盤 取付金具)","chips":{"ja":["CM-600L コン柱用","20-30cm","取付金具"],"ko":["CM-600L 전주용","20-30cm","부착 금구"]},"use":{"ko":"<b>계량기함(WHM盤)</b>을 둥근 전봇대에 붙들어 매는 <b>금속 받침 금구</b>입니다. 둥근 전주 표면에 평평한 함을 안정적으로 고정해 주는 연결 부속입니다.","ja":"<b>計器箱(WHM盤)</b>を丸い電柱に取り付ける<b>金属の取付金具</b>です。丸い柱面に平らな箱を安定して固定するための連結部材です。"},"perf":{"ko":"형번 CM-600L 콘크리트 전주용, 폭 20-30cm 대응이라 둥근 전주 곡면에 함을 딱 맞춰 고정합니다.","ja":"型番 CM-600L コンクリート柱用、幅20-30cm対応で、丸い柱の曲面に箱をぴったり固定します。"},"eff":{"ko":"전용 금구를 쓰면 함이 흔들리지 않고 단단히 붙어 오래 안정적으로 유지됩니다.","ja":"専用金具を使えば箱がぐらつかずしっかり付き、長く安定して保てます。"},"analogy":{"ko":"둥근 기둥에 액자를 거는 '맞춤형 벽걸이 받침대' 같은 금구입니다.","ja":"丸い柱に額を掛ける「専用の壁掛け受け」のような金具です。"}},"3_11":{"color":"linear-gradient(135deg,#b45309,#d97706)","emoji":"🪛","svg":"bracket","jp":"接地端子盤 取付金具","ko":"접지 단자함 부착 금구(接地端子盤 取付金具)","chips":{"ja":["CM-500L コン柱用","取付金具","固定"],"ko":["CM-500L 전주용","부착 금구","고정"]},"use":{"ko":"<b>접지 단자함</b>을 둥근 전봇대에 붙들어 매는 <b>금속 받침 금구</b>입니다. 둥근 전주 곡면에 단자함을 안정적으로 고정해 주는 연결 부속입니다.","ja":"<b>接地端子盤</b>を丸い電柱に取り付ける<b>金属の取付金具</b>です。丸い柱の曲面に端子盤を安定して固定する連結部材です。"},"perf :"전기를 땅으로 흘려보내는 <b>접지 공사 자재 묶음</b>입니다. 전주 밑 땅속에 묻는 <b>연동 꼰선(부드러운 구리 가닥을 꼬아 만든 접지선)</b>과, 땅의 <b>접지저항(전기가 땅으로 잘 빠지는 정도)</b>을 낮추는 약제 겔(치코겔)·지연제로 이루어집니다.","ja":"電気を地面へ逃がす<b>接地工事の資材セット</b>です。柱の下の地中に埋める<b>軟銅より線(柔らかい銅を撚った接地線)</b>と、地面の<b>接地抵抗(電気が地中へ流れやすい度合い)</b>を下げる薬剤ゲル(チコーゲル)・遅延剤からなります。"},"perf":{"ko":"연동 꼰선은 휘어지고 전기를 잘 통하며, 치코겔은 흙의 접지저항을 낮춰 줘 안전한 접지를 만듭니다.","ja":"軟銅より線は曲がりやすく電気をよく通し、チコーゲルは土の接地抵抗を下げ、安全な接地をつくります。"},"eff":{"ko":"약제로 저항을 낮추면 땅이 메마른 곳에서도 접지가 잘 잡혀 감전·낙뢰 사고를 줄입니다.","ja":"薬剤で抵抗を下げれば乾いた土地でも接地が効き、感電・落雷事故を減らせます。"},"analogy":{"ko":"전기를 땅으로 흘려보내는 '배수로와 흙을 촉촉하게 만드는 약'을 합친 세트입니다.","ja":"電気を地面へ流す「排水路と、土を湿らせる薬」を合わせたセットです。"}},"3_15":{"color":"linear-gradient(135deg,#475569,#64748b)","emoji":"➕","svg":"pole","jp":"腕金·バンド類一式(装柱)","ko":"완금·밴드 일습(장주)","chips":{"ja":["腕金1.8□×75","終端支持腕金 L1050","各種バンド"],"ko":["완금 1.8□×75","종단지지 완금 L1050","각종 밴드"]},"use":{"ko":"전봇대 위쪽에 가로로 붙이는 <b>쇠 가로대(완금=전주의 팔)</b>와 그것을 묶는 <b>밴드 묶음</b>입니다. 이 가로대 위에 전선과 애자(절연 부품)를 매달아, 전선을 전주에 거는 작업(<b>장주=전주에 기기·전선을 매다는 일</b>)의 바탕이 됩니다.","ja":"電柱の上部に横向きに取り付ける<b>鉄の腕(腕金=柱の腕)</b>と、それを締める<b>バンド一式</b>です。この腕の上に電線や碍子(絶縁部品)を吊るし、電線を柱に掛ける作業(<b>装柱=柱に機器・電線を取り付ける作業</b>)の土台になります。"},"perf":{"ko":"완금 1.8□×75와 종단지지 완금 L1050 등 규격품 일습이라, 전선 위치와 장력을 표준대로 잡아 줍니다.","ja":"腕金1.8□×75や終端支持腕金 L1050 など規格品一式で、電線の位置と張力を標準どおり保ちます。"},"eff":{"ko":"규격 완금·밴드를 한 세트로 받으면 장주 작업이 빠르고 빠짐없이 진행됩니다.","ja":"規格の腕金・バンドを一式で揃えると、装柱作業が速く漏れなく進みます。"},"analogy":{"ko":"전선을 걸 수 있게 전주에 단 '빨래 너는 가로대(빨랫대)' 같은 팔입니다.","ja":"電線を掛けるため柱に付けた「物干し竿のような横棒(腕)」です。"}},"3_16":{"color":"linear-gradient(135deg,#475569,#64748b)","emoji":"🪢","svg":"pole","jp":"支線一式(アンカー/ロッド/玉碍子/支線/グリップ)","ko":"지선 일습(버팀줄 세트)","chips":{"ja":["支線アンカーNo.3","ロッド19φ/玉碍子85φ","鋼より線38sq"],"ko":["지선 앵커 No.3","로드 19φ/옥애자 85φ","강 꼰선 38sq"]},"use":{"ko":"전봇대가 한쪽으로 당겨질 때 반대쪽 땅에 비스듬히 매는 <b>버팀줄(지선=전주를 잡아당겨 균형 잡는 강철 줄)</b> 세트입니다. 전선의 장력에 전주가 기울어 넘어지지 않게, 줄과 땅속 앵커·애자·줄잡이(그립)로 반대 방향에서 잡아 줍니다.","ja":"電柱が片側に引っ張られる時、反対側の地面へ斜めに張る<b>支線(柱を引き戻して均衡を取る鋼の綱)</b>セットです。電線の張力で柱が傾き倒れないよう、綱と地中アンカー・碍子・グリップで反対方向から支えます。"},"perf":{"ko":"지선 .","ja":"地中に先に敷く「ケーブル用の曲がるトンネル」のような配管です。"}},"3_19":{"color":"linear-gradient(135deg,#15803d,#22c55e)","emoji":"🌍","svg":"ground","jp":"接地材一式(IV電線/接地測定端子/端子箱)","ko":"접지재 일습(접지 공사 자재 세트)","chips":{"ja":["接地ケーブルIV","測定端子A,D種/端子箱","接地棒14φ×1500L"],"ko":["접지 케이블 IV","측정단자 A,D종/단자함","접지봉 14φ×1500L"]},"use":{"ko":"전기를 땅으로 흘려보내는 <b>접지 공사 한 세트</b>입니다. 접지용 전선(IV)과 접지가 잘 되는지 재는 측정단자·단자함, 그리고 땅에 깊이 박는 <b>접지봉(땅에 박아 전기를 흘려보내는 금속 막대)</b>으로 구성됩니다.","ja":"電気を地面へ逃がす<b>接地工事の一式</b>です。接地用電線(IV)と、接地が効くか測る測定端子・端子箱、そして地面に深く打ち込む<b>接地棒(地面に刺して電気を流す金属棒)</b>からなります。"},"perf":{"ko":"접지 케이블 IV, A·D종 측정단자, 단자함, 접지봉 14φ×1500L(지름 14mm·길이 1.5m)로 구성돼 표준 접지공사를 한 번에 갖춥니다.","ja":"接地ケーブルIV、A・D種測定端子、端子箱、接地棒14φ×1500L(径14mm・長さ1.5m)で構成され、標準的な接地工事を一括で揃えます。"},"eff":{"ko":"접지봉을 깊이 박고 선을 잇고 단자로 측정까지 한 세트로 끝나 접지공사가 빠짐없이 됩니다.","ja":"接地棒を深く打ち込み、線を繋ぎ、端子で測定まで一式で済み、接地工事が漏れなく進みます。"},"analogy":{"ko":"전기를 땅으로 빼는 '땅에 꽂는 침과 그 배선·점검 도구'를 합친 세트입니다.","ja":"電気を地面へ抜く「地面に刺す杭と、その配線・点検道具」を合わせたセットです。"}},"3_20":{"color":"linear-gradient(135deg,#7c3aed,#a855f7)","emoji":"🔲","svg":"plate","jp":"フリープレート(中部電力仕様)","ko":"프리플레이트(다공 받침판)","chips":{"ja":["伊藤電気 FP-6500LB","PS-300","中部電力仕様/地域差"],"ko":["이토전기 FP-6500LB","PS-300","주부전력 사양/지역차"]},"use":{"ko":"전봇대에 먼저 붙여 두는 <b>구멍이 많이 뚫린 금속 받침판</b>입니다. 그 위라면 어디든 기기를 볼트로 붙일 수 있어, 함·금구의 부착 위치를 자유롭게 정하게 해 주는 바탕판입니다.","ja":"電柱に先に取り付ける<b>多数の穴があいた金属の受け板</b>です。その上ならどこでも機器をボルト留めでき、盤や金具の取付位置を自由に決められる土台板です。"},"perf":{"ko":"이토전기 FP-6500LB·PS-300(주부전력 사양)이라 표준 함·금구가 곧장 맞고, 구멍이 많아 위치를 마음대로 잡습니다.","ja":"伊藤電気 FP-6500LB・PS-300(中部電力仕様)で標準の盤・金具がそのまま合い、穴が多く位置を自在に取れます。"},"eff":{"ko":"현장에서 기기 위치를 미세 조정할 수 있어 배치 실수나 재시공이 줄어듭니다.","ja":"現場で機器位置を微調整でき、配置ミスや手戻りが減ります。"},"analogy":{"ko":"어디든 못을 박을 수 있는 '구멍 뚫린 타공 선반판' 같은 받침입니다.","ja":"どこでも留められる「穴あきの有孔ボード」のような受け板です。"}},"3_21":{"color":"linear-gradient(135deg,#0369a1,#0ea5e9)","emoji":"🧵","svg":"wire","jp":"IV電線 各種(盤内·接地配線)","ko":"IV 전선 각종(함 내부·접지 배선)","chips":{"ja":["IV5.5/IV14/IV22","IV60/IV100","盤内·接地"],"ko":["IV5.5/IV14/IV22","IV60/IV100","함 내부·접지"]},"use":{"ko":"<b>비닐로 감싼 절연 전선
