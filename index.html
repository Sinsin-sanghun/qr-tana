<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>しろくま電力 QR棚管理</title>
<style>
:root{--navy:#16324f;--blue:#2b6cb0;--sky:#eaf3fb;--line:#d9e4ef;--green:#2f855a;--greenbg:#e4f5ec;
--amber:#b7791f;--amberbg:#fdf3dd;--red:#c53030;--redbg:#fdeaea;--gray:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;background:#eef3f8;color:#243447;line-height:1.55;padding-bottom:40px}
header{background:linear-gradient(120deg,#16324f,#2b5c8f);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header .t{font-size:1.15rem;font-weight:800}
header .s{font-size:.75rem;opacity:.8}
header a{color:#cfe3f5;font-size:.78rem;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.chip{border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:700}
.cg{background:var(--greenbg);color:var(--green)}.ca{background:var(--amberbg);color:var(--amber)}
.cr{background:var(--redbg);color:var(--red)}.cn{background:#e2e8f0;color:#475569}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.warn{background:#fffafa;border-color:#f3c7c7}
.itemrow{display:flex;align-items:center;gap:10px}
.iname{font-weight:700;font-size:.92rem}
.imeta{font-size:.72rem;color:var(--gray)}
.iqty{font-size:1.5rem;font-weight:800;min-width:64px;text-align:right}
.iunit{font-size:.7rem;color:var(--gray);text-align:right}
.badge{border-radius:12px;padding:2px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.bg{background:var(--greenbg);color:var(--green)}.ba{background:var(--amberbg);color:var(--amber)}
.br{background:var(--redbg);color:var(--red)}.bn{background:#e2e8f0;color:#475569}
.subline{font-size:.72rem;color:var(--gray);margin-top:4px}
.btnrow{display:flex;gap:8px;margin-top:8px}
button{border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
.bout{background:var(--blue);color:#fff;padding:9px 0;flex:1;font-size:.95rem}
.bin{background:var(--green);color:#fff;padding:9px 0;flex:1;font-size:.95rem}
.bset{background:#e2e8f0;color:#475569;padding:9px 12px;font-size:.8rem}
.baddbig{width:100%;background:#fff;border:2px dashed var(--blue);color:var(--blue);padding:12px;font-size:.95rem;border-radius:12px;margin:4px 0 14px}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.shelfcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;text-decoration:none;color:inherit;display:block}
.shelfcard .c{font-size:1.15rem;font-weight:800;color:var(--navy)}
.shelfcard .l{font-size:.7rem;color:var(--gray)}
.shelfcard .n{font-size:.75rem;margin-top:4px}
h2{font-size:.95rem;color:var(--navy);margin:14px 0 8px}
.hist{font-size:.78rem;color:#475569;padding:5px 0;border-bottom:1px dashed var(--line)}
.hist b.out{color:var(--blue)} .hist b.in{color:var(--green)} .hist b.adj{color:var(--amber)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(22,50,79,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.md{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:640px;padding:18px 16px 26px;max-height:86vh;overflow-y:auto}
.md h3{color:var(--navy);font-size:1.02rem;margin-bottom:12px}
.md label{display:block;font-size:.78rem;color:var(--gray);margin:10px 0 4px}
.md input,.md select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;font-size:1rem;font-family:inherit}
.md input:focus{outline:2px solid var(--blue)}
.qbtns{display:flex;gap:6px;margin-top:6px}
.qbtns button{background:var(--sky);color:var(--navy);padding:8px 0;flex:1;font-size:.9rem}
.mact{display:flex;gap:10px;margin-top:16px}
.mcancel{background:#e2e8f0;color:#475569;padding:12px 0;flex:1;font-size:.95rem}
.mok{background:var(--navy);color:#fff;padding:12px 0;flex:2;font-size:.95rem}
.mok.out{background:var(--blue)} .mok.in{background:var(--green)}
.pick{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:9px;margin-top:6px}
.pk{padding:9px 12px;border-bottom:1px solid #eef3f8;font-size:.85rem;cursor:pointer}
.pk:active{background:var(--sky)}
.pk .m{font-size:.7rem;color:var(--gray)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:10px 22px;border-radius:24px;font-size:.85rem;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--gray);font-size:.85rem;padding:26px 0}
.loading{text-align:center;color:var(--gray);padding:40px 0}
.shipbtn{width:100%;background:var(--navy);color:#fff;padding:13px;font-size:.95rem;border-radius:12px;margin:4px 0 10px}
.sdoc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;margin-bottom:14px}
.sdoc h1{font-size:1.25rem;color:#111;border-bottom:3px solid #16324f;padding-bottom:8px;margin-bottom:4px}
.sdoc .smeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.95rem;margin:10px 0 14px}
.sdoc table{width:100%;border-collapse:collapse;font-size:.9rem}
.sdoc th{background:#eef3f8;border:1.5px solid #94a3b8;padding:7px 8px;color:#111}
.sdoc td{border:1.5px solid #94a3b8;padding:7px 8px;vertical-align:middle}
.sdoc .qtd{text-align:center;width:76px}
.sdoc .ntd{text-align:center;font-size:1.05rem;font-weight:800;width:90px}
.sdoc .foot{font-size:.75rem;color:#475569;margin-top:12px}
@media print{
  header,.noprint{display:none!important}
  body{background:#fff;padding:0}
  .wrap{max-width:none;padding:0}
  .sdoc{border:none;border-radius:0;padding:6mm 4mm}
}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex-shrink:0}
.thumb-e{width:56px;height:56px;border-radius:8px;border:1.5px dashed #b9cbdc;color:#b9cbdc;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:120;touch-action:pan-y}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:74vh;border-radius:8px;user-select:none;-webkit-user-drag:none}
.lbtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#fff;z-index:6}
.lbcnt{font-size:.9rem;font-weight:700;opacity:.9}
.lbx{background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:38px;height:38px;font-size:1.1rem}
.lbdots{display:flex;gap:7px;margin-top:16px}
.lbdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.lbdot.on{background:#fff}
.lbnavL,.lbnavR{position:absolute;top:80px;bottom:120px;width:33%;z-index:3}
.lbnavL{left:0}.lbnavR{right:0}
.lbbtm{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:12px;padding:16px;z-index:6}
.lbbtn{background:rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:9px 20px;font-size:.85rem}
.lbbtn.del{background:rgba(197,48,48,.55)}
.thwrap{position:relative;flex-shrink:0}
.phn{position:absolute;right:-5px;top:-5px;background:var(--navy);color:#fff;border-radius:10px;font-size:.62rem;padding:1px 6px;font-weight:700;border:1.5px solid #fff}
.pk{display:flex;gap:9px;align-items:center}
.pkt{width:42px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.pkt-e{width:42px;height:42px;border-radius:6px;border:1px dashed #d3dee9;flex-shrink:0}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="t" id="hTitle">📦 QR棚管理</div><div class="s" id="hSub">しろくま電力 購買部 ・ 野田倉庫</div></div>
    <div style="text-align:right"><a href="#approvals" id="hAppr">✅ 承認</a>　<a href="#" id="hHome">🏠 全体</a></div>
  </div>
</header>
<div class="wrap" id="app"><div class="loading">読み込み中…</div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb">
  <div class="lbtop"><span class="lbcnt" id="lbCnt"></span><button class="lbx" onclick="lbClose()">✕</button></div>
  <div class="lbnavL" onclick="lbNav(-1)"></div>
  <img id="lbImg" alt="">
  <div class="lbnavR" onclick="lbNav(1)"></div>
  <div class="lbdots" id="lbDots"></div>
  <div class="lbbtm">
    <button class="lbbtn" onclick="lbAdd()">📷 写真を追加</button>
    <button class="lbbtn del" onclick="lbDel()">🗑 この写真を削除</button>
  </div>
</div>
<input type="file" id="phFile" accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const URL0='https://ndbqaphghlfcsfkfwbnn.supabase.co/rest/v1/';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYnFhcGhnaGxmY3Nma2Z3Ym5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTExNTIsImV4cCI6MjA5NDMyNzE1Mn0.F_iAEpv8yz7Cyy6ra6svJa8GdZnoyguayxAsFSuEcrY';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const sb=window.supabase.createClient('https://ndbqaphghlfcsfkfwbnn.supabase.co',KEY);
let SHELVES=[],ITEMS=[],TX=[],REQS=[],PHOTOS=[],ARS=[],SHIPS=[],PINHASH='';
let SESSION=null,ME='',MENAME='',ISADMIN=false,READY=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path,opt){
  const r=await fetch(URL0+path,Object.assign({headers:H},opt||{}));
  if(!r.ok){throw new Error(await r.text());}
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function loadAll(){
  let ST;
  [SHELVES,ITEMS,TX,REQS,PHOTOS,ARS,SHIPS,ST]=await Promise.all([
    api('qr_shelves?select=*&order=sort'),
    api('qr_items?select=*&order=item_code&limit=5000'),
    api('qr_transactions?select=*&order=created_at.desc&limit=10000'),
    api('qr_change_requests?select=*&order=created_at.desc&limit=200'),
    api('qr_item_photos?select=*&order=sort,id&limit=10000'),
    ISADMIN?api('qr_access_requests?select=*&order=created_at.desc&limit=100'):Promise.resolve([]),
    api('qr_shipments?select=*&order=ship_date.desc,id.desc&limit=100'),
    api('qr_settings?key=eq.approval_pin_hash&select=value')
  ]);
  PINHASH=ST?.[0]?.value||'';
}
function pendingARs(){return (ARS||[]).filter(r=>r.status==='pending');}
function photosFor(iid){return PHOTOS.filter(p=>p.item_id===iid);}
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function pendingReqs(){return REQS.filter(r=>r.status==='pending');}
function itemById(id){return ITEMS.find(i=>i.id===id);}
function stocksFor(shelf){
  const m={};
  for(const t of TX){ if(shelf&&t.shelf_code!==shelf)continue;
    m[t.item_id]=(m[t.item_id]||0)+Number(t.qty); }
  return m;
}
function out30(shelf,itemId){
  const lim=Date.now()-30*864e5; let s=0;
  for(const t of TX){ if(t.kind!=='out')continue; if(shelf&&t.shelf_code!==shelf)continue;
    if(t.item_id!==itemId)continue; if(new Date(t.created_at).getTime()<lim)continue; s+=-Number(t.qty);}
  return s;
}
function judge(qty,o30,minq){
  if(qty<=0)return{k:'bn',t:'在庫0'};
  const daily=o30/30, left=daily>0?qty/daily:null;
  if(qty<=Number(minq||0)||(left!==null&&left<=7))return{k:'br',t:'🚨 不足',left};
  if(left!==null&&left<=30)return{k:'ba',t:'⚠️ 注意',left};
  return{k:'bg',t:'✅ 十分',left};
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function fmtD(s){const d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate();}

/* ---------- views ---------- */
function render(){
  const n=pendingReqs().length+(ISADMIN?pendingARs().length:0);
  $('hAppr').textContent=n?`✅ 承認(${n})`:'✅ 承認';
  const h=decodeURIComponent(location.hash.replace('#',''));
  if(h==='approvals'){renderApprovals();window.scrollTo(0,0);return;}
  if(h==='newship'){renderNewShip();window.scrollTo(0,0);return;}
  if(h.startsWith('S-')){
    const sp=SHIPS.find(x=>x.id===+h.slice(2));
    if(sp){renderShip(sp);window.scrollTo(0,0);return;}
  }
  if(h.startsWith('I-')){
    const code=h.slice(2);
    const it=ITEMS.find(x=>(x.item_code||'')===code);
    if(it){renderItem(it);window.scrollTo(0,0);return;}
  }
  const shelf=SHELVES.find(s=>s.code===h);
  if(shelf)renderShelf(shelf); else renderDash();
  window.scrollTo(0,0);
}
function renderItem(it){
  $('hTitle').textContent='📦 '+(it.item_code||'資材');
  const phs=photosFor(it.id);
  const phHtml=phs.length?`<div style="display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px">${phs.map(p=>`<img src="${esc(p.url)}" loading="lazy" style="width:86px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0" onclick="showPhs(${it.id})">`).join('')}</div>`:'';
  let total=0;
  const rows=SHELVES.map(s=>{
    const q=stocksFor(s.code)[it.id]||0; if(!q)return '';
    total+=q;
    const o=out30(s.code,it.id); const j=judge(q,o,it.min_qty);
    return `<div class="card ${j.k==='br'?'warn':''}"><div class="itemrow">
      <div style="flex:1"><div class="iname">📍 ${esc(s.code)}</div><div class="imeta">${esc(s.label)}</div></div>
      <div><div class="iqty">${q}</div><div class="iunit">${esc(it.unit||'')}</div></div>
      <span class="badge ${j.k}">${j.t}</span></div>
      <div class="btnrow">
        <button class="bout" onclick="mvModal(${it.id},'${s.code}','out')">− 出庫</button>
        <button class="bin" onclick="mvModal(${it.id},'${s.code}','in')">＋ 入庫</button>
      </div></div>`;
  }).join('');
  const hist=TX.filter(t=>t.item_id===it.id).slice(0,15).map(t=>{
    const cls=t.kind==='out'?'out':t.kind==='in'?'in':'adj';const sign=Number(t.qty)>0?'+':'';
    return `<div class="hist">${fmtD(t.created_at)} <b class="${cls}">${t.kind==='out'?'出庫':t.kind==='in'?'入庫':t.kind==='init'?'初期登録':'調整'} ${sign}${t.qty}</b> ｜ ${esc(t.shelf_code)} ${t.site?'→ '+esc(t.site):''} ${t.created_by?'('+esc(t.created_by)+')':''}</div>`;
  }).join('')||'<div class="empty">記録なし</div>';
  $('app').innerHTML=`
    <div class="card">
      <div class="itemrow">
        <div style="flex:1"><div class="iname" style="font-size:1.02rem">${esc(it.name)}</div>
        <div class="imeta">${esc(it.model||'')} [${esc(it.item_code||'')}] ・ 単位 ${esc(it.unit||'')}</div></div>
        <div><div class="iqty">${total}</div><div class="iunit">全棚合計</div></div>
      </div>
      ${phHtml}
      <div class="btnrow">
        <button class="bset" style="flex:1" onclick="minModal(${it.id})">⚙ 設定</button>
        <button class="bset" style="flex:1" onclick="showItemQR(${it.id})">📇 QR</button>
        <button class="bset" style="flex:1" onclick="phStart(${it.id})">📷 写真</button>
      </div>
    </div>
    <h2>保管場所ごとの在庫</h2>
    ${rows||'<div class="empty">この資材はまだどの棚にも登録されていません。<br>棚ページの「＋この棚に資材を登録」から登録してください。</div>'}
    <h2>この資材の記録</h2><div class="card">${hist}</div>`;
}
function renderDash(){
  $('hTitle').textContent='📦 QR棚管理 — 全体';
  let nR=0,nA=0,nG=0;
  const shelfHtml=SHELVES.map(s=>{
    const st=stocksFor(s.code); let worst='',cnt=0;
    for(const[iid,q]of Object.entries(st)){ if(q<=0)continue; cnt++;
      const j=judge(q,out30(s.code,+iid),itemById(+iid)?.min_qty);
      if(j.k==='br'){worst='br';nR++;} else if(j.k==='ba'){if(worst!=='br')worst='ba';nA++;} else if(j.k==='bg'){nG++;if(!worst)worst='bg';}}
    const mark=worst==='br'?'🚨':worst==='ba'?'⚠️':cnt?'✅':'—';
    return `<a class="shelfcard" href="#${s.code}"><div class="c">${esc(s.code)}</div><div class="l">${esc(s.label)}</div><div class="n">${mark} ${cnt}品目</div></a>`;
  }).join('');
  const shortRows=[];
  for(const s of SHELVES){const st=stocksFor(s.code);
    for(const[iid,q]of Object.entries(st)){ if(q<=0)continue;
      const it=itemById(+iid); const j=judge(q,out30(s.code,+iid),it?.min_qty);
      if(j.k==='br'||j.k==='ba')shortRows.push({s:s.code,it,q,j});}}
  shortRows.sort((a,b)=>a.j.k==='br'?-1:1);
  const shortHtml=shortRows.length?shortRows.map(r=>
    `<div class="card ${r.j.k==='br'?'warn':''}"><div class="itemrow">
      <div style="flex:1"><div class="iname">${esc(r.it?.name)}</div><div class="imeta">${esc(r.s)} ・ ${esc(r.it?.model||'')}</div></div>
      <div><div class="iqty" style="color:${r.j.k==='br'?'var(--red)':'var(--amber)'}">${r.q}</div><div class="iunit">${esc(r.it?.unit||'')}</div></div>
      <span class="badge ${r.j.k}">${r.j.t}</span></div></div>`).join(''):'<div class="empty">不足・注意の資材はありません</div>';
  const recent=TX.slice(0,15).map(t=>{const it=itemById(t.item_id);
    const cls=t.kind==='out'?'out':t.kind==='in'?'in':'adj';
    const sign=Number(t.qty)>0?'+':'';
    return `<div class="hist">${fmtD(t.created_at)} <b class="${cls}">${t.kind==='out'?'出庫':t.kind==='in'?'入庫':t.kind==='init'?'初期登録':'調整'} ${sign}${t.qty}</b> ${esc(it?.name||'')} ｜ ${esc(t.shelf_code)} ${t.site?'→ '+esc(t.site):''}</div>`;}).join('')||'<div class="empty">まだ記録がありません</div>';
  $('app').innerHTML=`
    <div class="chips"><span class="chip cr">🚨 不足 ${nR}</span><span class="chip ca">⚠️ 注意 ${nA}</span><span class="chip cg">✅ 十分 ${nG}</span><span class="chip cn">棚 ${SHELVES.length}</span><span class="chip cn" style="cursor:pointer" onclick="doLogout()">👤 ${esc(MENAME)}｜ログアウト</span></div>
    <button class="shipbtn" onclick="NEWSHIP=null;location.hash='newship'">🚚 出荷リストを作成（現場へ資材を送る）</button>
    ${SHIPS.length?`<h2>最近の出荷</h2><div class="card">${SHIPS.slice(0,5).map(sp=>`<div class="hist" style="cursor:pointer" onclick="location.hash='S-${sp.id}'">📄 ${esc(sp.ship_date)} ${esc(sp.site)} <span style="color:var(--blue)">［リストを開く］</span></div>`).join('')}</div>`:''}
    <h2>棚一覧（タップで棚ページへ）</h2><div class="shelfgrid">${shelfHtml}</div>
    <h2>要対応（不足・注意）</h2>${shortHtml}
    <h2>最近の記録</h2><div class="card">${recent}</div>`;
}

    <button class="mok" onclick="submitFix(${iid},'${shelf}')">送信</button></div>`);
};
window.submitFix=async function(iid,shelf){
  const rtype=$('fType').value;
  const newQty=rtype==='qty'?Number($('fQty').value):null;
  if(rtype==='qty'&&(isNaN(newQty)||newQty<0)){toast('新しい数量を入力してください');return;}
  const reason=($('fReason').value||'').trim();
  const who=($('fWho').value||'').trim(); if(who)localStorage.setItem('qr_who',who);
  const pin=($('fPin').value||'').trim();
  try{
    const r=await api('qr_change_requests?select=id',{method:'POST',headers:Object.assign({},H,{'Prefer':'return=representation'}),
      body:JSON.stringify({rtype,shelf_code:shelf,item_id:iid,new_qty:newQty,reason,requested_by:who})});
    const reqId=r[0].id;
    if(pin){
      if(await sha256(pin)!==PINHASH){await loadAll();closeMd();render();toast('承認コードが違います → 承認待ちに登録しました');return;}
      await applyReq(REQS_fresh(reqId,{id:reqId,rtype,shelf_code:shelf,item_id:iid,new_qty:newQty}));
      await loadAll();closeMd();render();toast('承認・反映しました（李相勲）');
    }else{
      await loadAll();closeMd();render();toast('申請しました（承認待ち）');
    }
  }catch(e){toast('エラー');console.error(e);}
};
function REQS_fresh(id,fallback){return REQS.find(x=>x.id===id)||fallback;}
async function applyReq(req){
  const cur=stocksFor(req.shelf_code)[req.item_id]||0;
  const delta=req.rtype==='delete'?-cur:(Number(req.new_qty)-cur);
  if(delta!==0){
    await api('qr_transactions',{method:'POST',body:JSON.stringify({
      shelf_code:req.shelf_code,item_id:req.item_id,qty:delta,kind:'adjust',
      memo:(req.rtype==='delete'?'削除':'数量修正')+'承認 申請#'+req.id,created_by:'李相勲(承認)'})});
  }
  await api('qr_change_requests?id=eq.'+req.id,{method:'PATCH',body:JSON.stringify({
    status:'approved',decided_by:'李相勲',decided_at:new Date().toISOString()})});
}
function renderApprovals(){
  $('hTitle').textContent='✅ 承認待ち一覧';

      </div></div>`;
  }).join('')||'<div class="empty">承認待ちの申請はありません</div>';
  const done=REQS.filter(r=>r.status!=='pending').slice(0,10).map(r=>{
    const it=itemById(r.item_id);
    return `<div class="hist">${fmtD(r.created_at)} ${r.rtype==='delete'?'削除':'数量修正'} ${esc(it?.name||'')} ｜ ${esc(r.shelf_code)} → <b class="${r.status==='approved'?'in':'out'}">${r.status==='approved'?'承認済':'却下'}</b></div>`;
  }).join('')||'<div class="empty">履歴なし</div>';
  const uPend=ISADMIN?pendingARs():[];

        <button class="bset" style="flex:1" onclick="userDecide(${r.id},'reject')">✖ 却下</button>
      </div></div>`).join('');
  $('app').innerHTML=`
    <div class="chips"><span class="chip ${(pend.length+uPend.length)?'cr':'cn'}">承認待ち ${pend.length+uPend.length}件</span><span class="chip cn">最終承認者: 李相勲</span></div>
    ${ISADMIN?`<h2>👤 ユーザー承認（アクセス申請）</h2>${uRows||'<div class="empty">アクセス申請はありません</div>'}`:''}
    <h2>📦 在庫の修正・削除申請</h2>
    ${rows}
    <h2>処理済み（直近10件）</h2><div class="card">${done}</div>`;

window.userDecide=async function(id,action){
  const r=ARS.find(x=>x.id===id); if(!r)return;
  if(!confirm((action==='approve'?'アクセス承認':'却下')+': '+r.email+' でよろしいですか？'))return;
  try{
    if(action==='approve'){
      await api('qr_allowed_users?on_conflict=email',{method:'POST',headers:Object.assign({},H,{'Prefer':'resolution=merge-duplicates'}),
        body:JSON.stringify({email:(r.email||'').toLowerCase(),name:r.name||'',role:'member',approved_by:ME})});
    }
    await api('qr_access_requests?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:action==='approve'?'approved':'rejected',decided_by:ME,decided_at:new Date().toISOString()})});
    await loadAll();render();toast(action==='approve'?'アクセスを承認しました':'却下しました');
  }catch(e){toast('エラー');console.error(e);}
};
window.decideReq=async function(id,action){
  const req=REQS.find(r=>r.id===id); if(!req)return;
  openMd(`<h3>${action==='approve'?'✅ 承認':'✖ 却下'}の確認</h3>
    <label>承認コード（李相勲）</label>
    <input id="aPin" type="password">
    <div class="mact"><button class="mcancel" onclick="closeMd()">キャンセル</button>
    <button class="mok ${action==='approve'?'in':''}" onclick="doDecide(${id},'${action}')">${action==='approve'?'承認して反映':'却下する'}</button></div>`);
  setTimeout(()=>$('aPin').focus(),100);
};
window.doDecide=async function(id,action){
  const pin=($('aPin').value||'').trim();
  if(await sha256(pin)!==PINHASH){toast('承認コードが違います');return;}
  const req=REQS.find(r=>r.id===id);
  try{
    if(action==='approve'){await applyReq(req);}
    else{await api('qr_change_requests?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'rejected',decided_by:'李相勲',decided_at:new Date().toISOString()})});}
    await loadAll();closeMd();render();toast(action==='approve'?'承認・反映しました':'却下しました');
  }catch(e){toast('エラー');console.error(e);}
};

let SW={x:0,y:0};
$('lb').addEventListener('touchstart',e=>{SW.x=e.touches[0].clientX;SW.y=e.touches[0].clientY;},{passive:true});
$('lb').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-SW.x, dy=e.changedTouches[0].clientY-SW.y;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){lbNav(dx<0?1:-1);}
},{passive:true});
window.phStart=function(iid){PH_TARGET=iid;$('phFile').value='';$('phFile').click();};
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}
      const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}
$('phFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f||PH_TARGET==null)return;
  toast('写真をアップロード中…');
  try{
    const blob=await shrink(f,800,.72);
    const it=itemById(PH_TARGET);
    const name=((it?.item_code||('id'+PH_TARGET)).replace(/[^A-Za-z0-9_-]/g,''))+'_'+Date.now()+'.jpg';
    const r=await fetch('https://ndbqaphghlfcsfkfwbnn.supabase.co/storage/v1/object/qr-photos/'+name,
      {method:'POST',headers:{'apikey':KEY,'Authorization':H.Authorization,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error(await r.text());
    const url='https://ndbqaphghlfcsfkfwbnn.supabase.co/storage/v1/object/public/qr-photos/'+name;
    const nsort=photosFor(PH_TARGET).length;
    await api('qr_item_photos',{method:'POST',body:JSON.stringify({item_id:PH_TARGET,url,sort:nsort,created_by:localStorage.getItem('qr_who')||''})});
    const tgt=PH_TARGET;
    await loadAll();render();toast('写真を追加しました');
    if($('lb').classList.contains('on')&&LB.iid===tgt){LB.idx=photosFor(tgt).length-1;lbRender();}
  }catch(err){toast('写真の登録に失敗しました');console.error(err);}
  finally{PH_TARGET=null;}
});

/* ---------- 出荷リスト ---------- */
let NEWSHIP=null;
const WDAY=['日','月','火','水','木','金','土'];
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function wdayOf(ds){return WDAY[new Date(ds+'T00:00:00').getDay()];}
function siteList(){
  const s=new Set();
  SHIPS.forEach(x=>x.site&&s.add(x.site));
  TX.forEach(t=>t.site&&s.add(t.site));
  return [...s].slice(0,20);
}
function renderNewShip(){
  if(!NEWSHIP)NEWSHIP={date:todayStr(),site:'',lines:[]};
  $('hTitle').textContent='🚚 出荷リスト作成';
  const lines=NEWSHIP.lines.map((l,i)=>{
    const it=itemById(l.item_id);
    return `<div class="card"><div class="itemrow">
      <div style="flex:1"><div class="iname">${esc(it?.name)}</div><div class="imeta">${esc(l.shelf)}から ・ ${esc(it?.model||'')}</div></div>
      <div><div class="iqty">${l.qty}</div><div class="iunit">${esc(it?.unit||'')}</div></div>
      <button class="bset" onclick="NEWSHIP.lines.splice(${i},1);renderNewShip()">✖</button>
    </div></div>`;
  }).join('');
  $('app').innerHTML=`
    <div class="card">
      <label style="font-size:.78rem;color:var(--gray)">出荷日</label>
      <input id="shDate" type="date" value="${esc(NEWSHIP.date)}" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-size:1rem" onchange="NEWSHIP.date=this.value">
      <label style="font-size:.78rem;color:var(--gray);display:block;margin-top:10px">案件・行き先（必須）</label>
      <input id="shSite" list="siteDL" value="${esc(NEWSHIP.site)}" placeholder="例: 石山案件" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-size:1rem" oninput="NEWSHIP.site=this.value">
      <datalist id="siteDL">${siteList().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    </div>
    <h2>送る資材（${NEWSHIP.lines.length}件）</h2>
    ${lines||'<div class="empty">まだ資材がありません。下のボタンで追加してください。</div>'}
    <button class="baddbig" onclick="shipAddModal()">＋ 資材を追加</button>
    <div class="btnrow" style="margin-top:4px">
      <button class="mcancel" style="flex:1;padding:13px 0" onclick="NEWSHIP=null;location.hash=''">キャンセル</button>
      <button class="mok in" style="flex:2;padding:13px 0" onclick="submitShip()">✅ 確定して出庫（リスト発行）</button>
    </div>
    <div class="cap">確定すると各資材が在庫から出庫され、印刷用リストが開きます</div>`;
}
window.shipAddModal=function(){
  openMd(`<h3>＋ 送る資材を選択</h3>
    <label>資材を検索</label>
    <input id="mSearch" placeholder="品名・型番・コード" oninput="shipPickList()">
    <div class="pick" id="mPick"></div>
    <div class="mact"><button class="mcancel" onclick="closeMd()">閉じる</button></div>`);
  shipPickList(); setTimeout(()=>$('mSearch').focus(),100);
};
window.shipPickList=function(){
  const q=($('mSearch').value||'').toLowerCase();
  const withStock=ITEMS.map(i=>{
    const shelves=SHELVES.map(s=>({shelf:s.code,q:stocksFor(s.code)[i.id]||0})).filter(x=>x.q>0);
    return {i,shelves,total:shelves.reduce((a,b)=>a+b.q,0)};
  }).filter(x=>x.total>0)
    .filter(x=>!q||(x.i.name+' '+(x.i.model||'')+' '+(x.i.item_code||'')).toLowerCase().includes(q)).slice(0,40);
  $('mPick').innerHTML=withStock.map(x=>{const p=photosFor(x.i.id)[0];
    return `<div class="pk" onclick='shipShelf(${x.i.id})'>${p?`<img class="pkt" src="${esc(p.url)}" loading="lazy">`:'<div class="pkt-e"></div>'}<div style="flex:1"><b>${esc(x.i.name)}</b><div class="m">在庫合計 ${x.total}${esc(x.i.unit||'')} ・ ${x.shelves.map(s=>s.shelf+':'+s.q).join(' / ')}</div></div></div>`;
  }).join('')||'<div class="pk">在庫のある該当資材がありません</div>';
};
window.shipShelf=function(iid){
  const it=itemById(iid);
  const shelves=SHELVES.map(s=>({shelf:s.code,q:stocksFor(s.code)[iid]||0})).filter(x=>x.q>0);
  if(shelves.length===1){shipQty(iid,shelves[0].shelf);return;}
  openMd(`<h3>どの棚から出しますか？ — ${esc(it?.name)}</h3>
    <div class="pick">${shelves.map(x=>`<div class="pk" onclick="shipQty(${iid},'${x.shelf}')"><div style="flex:1"><b>${x.shelf}</b></div><div>${x.q}${esc(it?.unit||'')}</div></div>`).join('')}</div>
    <div class="mact"><button class="mcancel" onclick="shipAddModal()">戻る</button></div>`);
};
window.shipQty=function(iid,shelf){
  const it=itemById(iid); const cur=stocksFor(shelf)[iid]||0;
  openMd(`<h3>数量 — ${esc(it?.name)}</h3>
    <label>${esc(shelf)} の在庫 ${cur}${esc(it?.unit||'')} のうち、送る数量</label>
    <input id="mQty" type="number" inputmode="decimal" min="0.1" step="any">
    <div class="qbtns">${[1,2,5,10].map(n=>`<button onclick="$('mQty').value=${n}">${n}</button>`).join('')}</div>
    <div class="mact"><button class="mcancel" onclick="shipAddModal()">戻る</button>
    <button class="mok in" onclick="shipAddLine(${iid},'${shelf}')">リストに追加</button></div>`);
  setTimeout(()=>$('mQty').focus(),100);
};
window.shipAddLine=function(iid,shelf){
  const q=Number($('mQty').value); if(!q||q<=0){toast('数量を入力してください');return;}
  const cur=stocksFor(shelf)[iid]||0;
  const already=NEWSHIP.lines.filter(l=>l.item_id===iid&&l.shelf===shelf).reduce((a,l)=>a+l.qty,0);
  if(q+already>cur){toast(`在庫不足です（${shelf} 残 ${cur}、リスト済 ${already}）`);return;}
  NEWSHIP.lines.push({item_id:iid,shelf,qty:q});
  closeMd();renderNewShip();toast('追加しました');
};
window.submitShip=async function(){
  if(!NEWSHIP.site.trim()){toast('案件・行き先を入力してください');return;}
  if(!NEWSHIP.lines.length){toast('資材を追加してください');return;}
  if(!confirm(`${NEWSHIP.date}（${wdayOf(NEWSHIP.date)}） ${NEWSHIP.site}\n${NEWSHIP.lines.length}件の資材を出庫してリストを発行します。よろしいですか？`))return;
  try{
    const sp=await api('qr_shipments?select=id',{method:'POST',headers:Object.assign({},H,{'Prefer':'return=representation'}),
      body:JSON.stringify({ship_date:NEWSHIP.date,site:NEWSHIP.site.trim(),created_by:localStorage.getItem('qr_who')||MENAME})});
    const sid=sp[0].id;
    await api('qr_transactions',{method:'POST',body:JSON.stringify(NEWSHIP.lines.map(l=>({
      shelf_code:l.shelf,item_id:l.item_id,qty:-l.qty,kind:'out',site:NEWSHIP.site.trim(),
      shipment_id:sid,created_by:localStorage.getItem('qr_who')||MENAME})))});
    NEWSHIP=null;
    await loadAll();location.hash='S-'+sid;render();toast('出荷リストを発行しました');
  }catch(e){toast('エラー: 発行できませんでした');console.error(e);}
};
function renderShip(sp){
  $('hTitle').textContent='📄 出荷リスト';
  const txs=TX.filter(t=>t.shipment_id===sp.id);
  const agg={};
  txs.forEach(t=>{agg[t.item_id]=(agg[t.item_id]||0)+(-Number(t.qty));});
  const rows=Object.entries(agg).map(([iid,q],idx)=>{
    const it=itemById(+iid);
    const code=it?.item_code||('id'+iid);
    const qr=qrcode(0,'M');qr.addData(location.origin+location.pathname+'#I-'+encodeURIComponent(code));qr.make();
    const img=qr.createDataURL(4,2);
    return `<tr>
      <td class="ntd" style="width:36px;font-weight:400">${idx+1}</td>
      <td class="qtd"><img src="${img}" style="width:60px;height:60px;image-rendering:pixelated"><div style="font-size:.65rem;font-weight:700">${esc(code)}</div></td>
      <td><b>${esc(it?.name||'')}</b>${it?.model?`<div style="font-size:.75rem;color:#475569">${esc(it.model)}</div>`:''}</td>
      <td class="ntd">${q} <span style="font-size:.7rem;font-weight:400">${esc(it?.unit||'')}</span></td>
    </tr>`;
  }).join('');
  $('app').innerHTML=`
    <div class="btnrow noprint" style="margin-bottom:10px">
      <button class="mcancel" style="flex:1;padding:12px 0" onclick="location.hash=''">← 戻る</button>
      <button class="mok" style="flex:2;padding:12px 0" onclick="window.print()">🖨 印刷（A4）</button>
    </div>
    <div class="sdoc">
      <h1>出荷リスト</h1>
      <div style="font-size:.8rem;color:#475569">しろくま電力株式会社 購買部 ・ 野田倉庫</div>
      <div class="smeta">
        <div>📅 出荷日: <b>${esc(sp.ship_date)}（${wdayOf(sp.ship_date)}）</b></div>
        <div>📍 案件: <b>${esc(sp.site)}</b></div>
        <div>担当: ${esc(sp.created_by||'')}</div>
      </div>
      <table>
        <tr><th style="width:36px">No</th><th style="width:80px">QR</th><th>品名・型番</th><th style="width:92px">数量</th></tr>
        ${rows}
      </table>
      <div class="foot">※ 各QRコードをスマホで読み取ると、その資材の倉庫在庫（残数・保管場所）が確認できます（要ログイン・承認済みアカウント）。<br>発行: ${esc(sp.created_at?.slice(0,10)||'')} ・ リストNo. S-${sp.id}</div>
    </div>`;
}

/* ---------- 認証（Googleログイン + 承認制アクセス） ---------- */
async function rpcBool(fn){
  try{const r=await fetch(URL0+'rpc/'+fn,{method:'POST',headers:H,body:'{}'});
    if(!r.ok)return false; return (await r.json())===true;}catch(e){return false;}
}
function renderLogin(){
  $('hAppr').textContent='';
  $('app').innerHTML=`<div style="max-width:400px;margin:50px auto;text-align:center">
    <div class="card" style="padding:30px 22px">
      <div style="font-size:2.6rem">📦🔒</div>
      <h2 style="justify-content:center;margin:10px 0">QR棚管理システム</h2>
      <p style="font-size:.85rem;color:var(--gray);margin-bottom:18px">このページは承認されたメンバーのみ閲覧できます。<br>Googleアカウントでログインしてください。</p>
      <button class="mok" style="width:100%;padding:14px 0;font-size:1rem" onclick="doLogin()">G　Googleでログイン</button>
    </div></div>`;
}
async function renderWait(){
  $('hAppr').textContent='';
  let myReq=[];
  try{myReq=await api('qr_access_requests?select=*&email=eq.'+encodeURIComponent(ME)+'&order=created_at.desc&limit=1')||[];}catch(e){}
  const pending=myReq[0]&&myReq[0].status==='pending';
  const rejected=myReq[0]&&myReq[0].status==='rejected';
  $('app').innerHTML=`<div style="max-width:420px;margin:40px auto;text-align:center">
    <div class="card" style="padding:26px 22px">
      <div style="font-size:2.4rem">${pending?'⏳':rejected?'🚫':'🙋'}</div>
      <h2 style="justify-content:center;margin:10px 0">${pending?'承認待ちです':rejected?'アクセスが却下されました':'アクセス申請'}</h2>
      <p style="font-size:.83rem;color:var(--gray)">ログイン中: <b>${esc(ME)}</b></p>
      ${pending?`<p style="font-size:.85rem;color:var(--gray);margin:12px 0">管理者（李相勲）の承認をお待ちください。<br>承認後に下のボタンで再確認してください。</p>
        <button class="mok" style="width:100%;padding:12px 0;margin-top:8px" onclick="location.reload()">🔄 承認されたか確認</button>`
      :rejected?`<p style="font-size:.85rem;color:var(--gray);margin:12px 0">管理者にお問い合わせください。</p>`
      :`<p style="font-size:.85rem;color:var(--gray);margin:10px 0">このアカウントはまだ承認されていません。<br>お名前を入力して申請してください。</p>
        <input id="reqName" placeholder="お名前（例: 染谷）" style="width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;font-size:1rem;margin:8px 0">
        <button class="mok in" style="width:100%;padding:12px 0" onclick="reqAccess()">アクセスを申請する</button>`}
      <button class="mcancel" style="width:100%;padding:11px 0;margin-top:10px" onclick="doLogout()">別のアカウントでログイン</button>
    </div></div>`;
}
window.reqAccess=async function(){
  const name=($('reqName')?.value||'').trim();
  if(!name){toast('お名前を入力してください');return;}
  try{
    await api('qr_access_requests',{method:'POST',body:JSON.stringify({email:ME,name})});
    renderWait();toast('申請しました');
  }catch(e){toast('エラー');console.error(e);}
};
window.doLogin=async function(){
  localStorage.setItem('qr_hash',location.hash||'');
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
};
window.doLogout=async function(){await sb.auth.signOut();localStorage.removeItem('qr_hash');location.hash='';location.reload();};

/* ---------- boot ---------- */
window.addEventListener('hashchange',()=>{if(READY)render();});
sb.auth.onAuthStateChange((ev,sess)=>{if(sess){H.Authorization='Bearer '+sess.access_token;}});
(async()=>{
  try{
    const {data}=await sb.auth.getSession(); SESSION=data.session;
    if(!SESSION){renderLogin();return;}
    H.Authorization='Bearer '+SESSION.access_token;
    ME=(SESSION.user?.email||'').toLowerCase();
    MENAME=SESSION.user?.user_metadata?.name||ME.split('@')[0];
    const saved=localStorage.getItem('qr_hash');
    if(saved&&!location.hash){history.replaceState(null,'',location.pathname+saved);}
    localStorage.removeItem('qr_hash');
    if(!await rpcBool('qr_is_allowed')){renderWait();return;}
    ISADMIN=await rpcBool('qr_is_admin');
    await loadAll();READY=true;render();
  }catch(e){$('app').innerHTML='<div class="empty">読み込みエラー。通信環境をご確認ください。</div>';console.error(e);}
})();
</script>
